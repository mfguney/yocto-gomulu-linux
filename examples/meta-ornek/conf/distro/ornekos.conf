# ÖrnekOS: Poky'yi temel alan örnek ürün dağıtımı (Bölüm 11)
# Kullanım: bitbake-config-build enable-fragment distro/ornekos

require conf/distro/poky.conf

DISTRO = "ornekos"
DISTRO_NAME = "ÖrnekOS"
DISTRO_VERSION = "0.1"
DISTRO_CODENAME = "ilk"
MAINTAINER = "Örnek Kurum <ornek@example.com>"

# Ürün politikası: systemd kullan (Poky'nin varsayılanı sysvinit'tir).
# systemd ve sysvinit 6.0 ile birlikte kullanılamaz; init-manager-systemd.inc
# DISTRO_FEATURES'a yalnızca "systemd usrmerge" ekler.
INIT_MANAGER = "systemd"

# Ekransız bir ağ geçidi: grafik, 3B, ses sunucusu ve mobil ağ/NFC gerekmez.
# 6.0 ile DISTRO_FEATURES_DEFAULTS içindeki özellikler otomatik olarak eklenir;
# istenmeyenler DISTRO_FEATURES_OPTED_OUT ile dışarıda bırakılır (Bölüm 11).
DISTRO_FEATURES_OPTED_OUT += "x11 wayland opengl vulkan pulseaudio 3g nfc"
