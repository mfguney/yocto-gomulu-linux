BB_CONF_FRAGMENT_SUMMARY = "Sürekli entegrasyon: otomatik imaj testi ve derleme geçmişi"
BB_CONF_FRAGMENT_DESCRIPTION = "testimage sınıfını etkinleştirir, QEMU'yu kullanıcı kipi \
ağıyla (slirp) çalıştırır ve buildhistory ile sürümler arası değişiklikleri kaydeder. \
testimage, ssh sunucusu ve parolasız root girişi gerektirir: ornek/gelistirici ve \
core/yocto/root-login-with-empty-password parçalarıyla birlikte kullanılır (Bölüm 18)."

# bitbake -c testimage ornek-image
IMAGE_CLASSES += "testimage"

# tap arayüzü ve sudo gerektirmeyen QEMU ağı (kurum içi CI çalıştırıcıları için)
TEST_RUNQEMUPARAMS += "slirp"

# Çalıştırılacak test modülleri (meta/lib/oeqa/runtime/cases/). Sıra önemlidir.
TEST_SUITES = "ping ssh date df"

# Paket, imaj ve SDK içeriklerinin git deposunda geçmişi (buildhistory-diff ile karşılaştırılır)
INHERIT += "buildhistory"
BUILDHISTORY_COMMIT = "1"
