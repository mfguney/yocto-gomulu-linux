BB_CONF_FRAGMENT_SUMMARY = "Ürün imajı: güvenli varsayılanlar ve izlenebilirlik"
BB_CONF_FRAGMENT_DESCRIPTION = "Kök dosya sistemini salt okunur yapar, imaja derleme \
bilgisini (/etc/buildinfo) ve lisans metinlerini ekler. Sahaya çıkacak imajlar içindir; \
ornek/gelistirici ve core/yocto/root-login-with-empty-password parçalarıyla birlikte \
kullanılmamalıdır (Bölüm 16-17)."

# Kök dosya sistemi salt okunur bağlanır. Yazılabilir veriler ayrı bir bölümde tutulmalıdır.
EXTRA_IMAGE_FEATURES += "read-only-rootfs"

# İmaj içine DISTRO, DISTRO_VERSION ve katman revizyonları yazılır: /etc/buildinfo
IMAGE_CLASSES += "image-buildinfo"

# Lisans manifestosu ve lisans metinleri cihaza kopyalanır (/usr/share/common-licenses)
COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"
