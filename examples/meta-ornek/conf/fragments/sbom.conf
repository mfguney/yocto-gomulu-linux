# SPDX-License-Identifier: MIT
BB_CONF_FRAGMENT_SUMMARY = "SBOM ayrıntıları ve tedarikçi bilgisi"
BB_CONF_FRAGMENT_DESCRIPTION = "SPDX 3.0 çıktısına tedarikçi bilgisini ve PACKAGECONFIG \
seçimlerini ekler, JSON dosyalarını okunabilir biçimde yazar ve sbom-cve-check için \
metin özet raporunu etkinleştirir. CVE taraması için core/yocto/sbom-cve-check parçası \
ayrıca etkinleştirilmelidir (Bölüm 16)."

# İnsan tarafından okunabilir (girintili) JSON. Dosya boyutu büyür.
SPDX_PRETTY = "1"

# Tarif başına etkin/devre dışı PACKAGECONFIG seçenekleri SBOM'a yazılır
SPDX_INCLUDE_PACKAGECONFIG = "1"

# İmaj SBOM'unun tedarikçisi (suppliedBy)
SPDX_IMAGE_SUPPLIER_name = "Örnek Kurum"
SPDX_IMAGE_SUPPLIER_type = "organization"
SPDX_IMAGE_SUPPLIER_id_email = "ornek@example.com"

# Kurumun kendi geliştirdiği paketlerin tedarikçisi
SPDX_PACKAGE_SUPPLIER_name:pn-sensor-oku = "Örnek Kurum"
SPDX_PACKAGE_SUPPLIER_type:pn-sensor-oku = "organization"

# sbom-cve-check: varsayılan iki JSON raporuna ek olarak .cve.txt özet raporu
SBOM_CVE_CHECK_EXPORT_VARS:append = " SBOM_CVE_CHECK_EXPORT_SUMMARY"
