# SPDX-License-Identifier: MIT
#@TYPE: Machine
#@NAME: Örnek ağ geçidi (QEMU ARMv8 tabanlı)
#@DESCRIPTION: Örnek sensör ağ geçidinin makine tanımı; donanımsız deneme için qemuarm64'ten türetilmiştir (Bölüm 10).
#
# Kullanım: bitbake-config-build enable-fragment machine/ornek-agecidi

# Temel makine: işlemci ayarları (tune), çekirdek türü, seri konsol ve
# runqemu ayarları bu dosyadan gelir.
require conf/machine/qemuarm64.conf

# qemuarm64 için yazılmış koşullu değerler (ör. linux-yocto tarifindeki
# COMPATIBLE_MACHINE ve KBRANCH:qemuarm64) bu makinede de geçerli olur.
MACHINEOVERRIDES =. "qemuarm64:"

# linux-yocto, çekirdek yapılandırmasını (BSP tanımını) KMACHINE adına göre
# seçer. Varsayılan değer MACHINE adıdır; türetilmiş makinede eşleme gerekir.
KMACHINE = "qemuarm64"

# Ekransız ağ geçidi: ses, ekran ve Bluetooth gerekmez.
# (qemu.inc'teki değer: "alsa bluetooth usbgadget screen vfat")
# MACHINE_FEATURES_DEFAULTS içindeki özellikler (rtc, qemu-usermode) 6.0 ile
# otomatik olarak eklenmeye devam eder; istenmeyenler
# MACHINE_FEATURES_OPTED_OUT ile dışarıda bırakılır.
MACHINE_FEATURES = "usbgadget vfat"
