# meta-ornek: "Yocto Project ile Gömülü Linux" kitabının örnek ürün katmanı

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ornek"
BBFILE_PATTERN_ornek = "^${LAYERDIR}/"
BBFILE_PRIORITY_ornek = "10"

LAYERDEPENDS_ornek = "core"
LAYERSERIES_COMPAT_ornek = "wrynose"
