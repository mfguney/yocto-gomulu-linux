# SPDX-License-Identifier: MIT
# meta-ornek-hatali: Bölüm 14 alıştırması için kasıtlı olarak hatalı tarifler içerir.
# Ürün derlemelerine eklenmemelidir.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ornekhatali"
BBFILE_PATTERN_ornekhatali = "^${LAYERDIR}/"
BBFILE_PRIORITY_ornekhatali = "6"

LAYERDEPENDS_ornekhatali = "core"
LAYERSERIES_COMPAT_ornekhatali = "wrynose"
